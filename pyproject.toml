[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "partestimator"
version = "1.1.0"
description = "One window for sheet metal (flat pattern, DXF) and machined parts (cycle time) from STEP files. Offline."
requires-python = ">=3.11,<3.14"
# Exact pins live in requirements.txt (and installed-lock.txt after setup);
# pe.ps1 installs from those, then installs this package editable with
# --no-deps. These are the same packages, unpinned, for anyone installing the
# package some other way.
dependencies = [
    "cadquery-ocp-novtk", "numpy", "scipy", "PySide6-Essentials",
    "vtk", "pyvista", "pyvistaqt", "qtpy", "ezdxf",
]

[project.scripts]
part-estimator = "partestimator.__main__:main"

[tool.setuptools.packages.find]
include = ["partestimator*"]

[tool.setuptools.package-data]
"partestimator" = ["data/*.csv"]
"partestimator.machining" = ["data/*.csv", "*.pdf"]
"partestimator.smt" = ["*.md"]

[tool.pytest.ini_options]
# Default to the fast tests: the timing model, the command line and the
# OpenGL choice, pure
# Python + numpy, so they run on a bare CI runner. The rest of tests/ needs
# the CAD kernel and Qt; run it with `.\pe.ps1 test -Full` (or `pytest tests`
# inside the full .venv).
testpaths = ["tests/timing", "tests/test_cli.py", "tests/test_opengl.py", "tests/test_stock.py"]
addopts = "-ra"
